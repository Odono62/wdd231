<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reviews & Blog – Local Eats</title>
  <meta name="description" content="Read reviews and blog posts about local restaurants and dishes.">
  <meta name="author" content="odono john jachukwu">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/large.css" media="(min-width:1000px)">
  <script defer src="js/reviews.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">Local Eats</a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Open navigation">
        <span class="hamburger"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="reviews.html">Reviews</a></li>
          <li><a href="about.html">About</a></li>
          <li><button id="theme-toggle" class="theme-toggle" aria-pressed="false">Dark</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <input id="search" type="search" placeholder="Search restaurants or dishes" aria-label="Search reviews">
      <select id="filter-cuisine" aria-label="Filter by cuisine">
        <option value="">All cuisines</option>
      </select>
      <button id="sort-rating" class="btn">Sort: Rating</button>
      <button id="sort-newest" class="btn">Sort: Newest</button>
    </section>

    <section id="reviews-list" class="reviews-grid">
      <!-- Review cards injected by JS -->
    </section>

    <div id="skeleton" class="skeleton-grid" hidden>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

  </main>

  <button id="scroll-top" class="scroll-top" aria-label="Scroll to top">↑</button>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <h3>Local Eats</h3>
        <p>Food blog & guide to the best restaurants around you.</p>
      </div>
      <div>
        <h4>Follow</h4>
        <div class="social">
          <a href="www.instagram.com" aria-label="Instagram">IG</a>
          <a href="www.twitter.com" aria-label="Twitter">TW</a>
          <a href="www.faceebook.com" aria-label="Facebook">FB</a>
        </div>
      </div>
      <div>
        <h4>Contact</h4>
        <p>odonoj62@gmail.com</p>
      </div>
    </div>
    <div class="container copyright">
      <p>&copy; <span id="year"></span> Odono John Jachukwu. Last modified: <span id="last-modified"></span></p>
    </div>
  </footer>
</body>
</html>
